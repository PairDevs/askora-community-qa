name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  # The release is only deployed if the whole test suite passes.
  test:
    name: Run test suite
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to WordPress.org
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release tag matches plugin version and Stable tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION_RE='[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*'
          HEADER=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' askora-community-qa.php | grep -oE "$VERSION_RE" | head -1)
          CONSTANT=$(grep -m1 "'ASKORA_VERSION'" askora-community-qa.php | grep -oE "$VERSION_RE" | head -1)
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | grep -oE "$VERSION_RE" | head -1)
          echo "release tag=$TAG, plugin header=$HEADER, ASKORA_VERSION=$CONSTANT, readme stable tag=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Release tag ($TAG) must equal the plugin Version ($HEADER), ASKORA_VERSION ($CONSTANT) and readme Stable tag ($STABLE)."
            exit 1
          fi

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist --no-dev --optimize-autoloader'

      - name: Remove source files from assets
        run: rm -rf .wordpress-org/hd

      - name: Verify the package contains no development or test files
        run: |
          # Same exclusion the deploy action applies (.distignore), checked after
          # `composer install --no-dev` so vendor/ holds runtime dependencies only.
          PKG="$(mktemp -d)"
          rsync -rc --exclude-from=.distignore ./ "$PKG/"

          for required in askora-community-qa.php readme.txt uninstall.php vendor/autoload.php Frontend/Inc/Helpers/Editor.php; do
            [ -e "$PKG/$required" ] || { echo "::error::Package is missing $required"; exit 1; }
          done

          LEAKED=""
          for forbidden in tests bin .github docs phpunit.xml phpunit.xml.dist .phpunit.result.cache \
                           vendor/phpunit vendor/yoast vendor/sebastian vendor/myclabs vendor/nikic vendor/phar-io vendor/theseer vendor/doctrine; do
            [ -e "$PKG/$forbidden" ] && LEAKED="$LEAKED $forbidden"
          done
          if [ -n "$LEAKED" ]; then
            echo "::error::These must not be published to WordPress.org:$LEAKED"
            exit 1
          fi
          echo "Package OK: $(find "$PKG" -type f | wc -l | tr -d ' ') files, no test or development files."

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: askora-community-qa

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.deploy.outputs.zip-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
