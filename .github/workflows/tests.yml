name: Tests

on:
  push:
    branches:
      - main
      - trunk
  pull_request:
  # Called by the release workflow so a failing suite blocks the WordPress.org deploy.
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: latest
          - php: '8.2'
            wp: latest
          - php: '8.4'
            wp: latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
          tools: composer

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Lint JavaScript
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Install dependencies (including dev)
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: Install the WordPress test library
        run: |
          command -v svn >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit
